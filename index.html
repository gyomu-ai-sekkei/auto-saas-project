<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI SaaS Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900 font-sans">
  <main class="max-w-5xl mx-auto px-6 py-20 flex flex-col items-center text-center">
    <div class="inline-block px-4 py-1.5 mb-6 text-sm font-semibold text-blue-800 bg-blue-100 rounded-full">
      Launch Coming Soon
    </div>
    <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight mb-6 leading-tight">
      Automate Your Workflow <br class="hidden md:block">
      <span class="text-blue-600">With AI Precision.</span>
    </h1>
    <p class="text-xl text-gray-600 mb-10 max-w-2xl">
      Stop wasting hours on manual tasks. Our AI-driven platform does the heavy lifting so you can focus on scaling your revenue.
    </p>
    
    <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
      <input 
        type="email" 
        placeholder="Enter your email" 
        class="px-6 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 w-full max-w-xs"
      >
      <button class="px-8 py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition duration-200">
        Join Waitlist
      </button>
    </div>
    
    <p class="mt-6 text-sm text-gray-500">
      No credit card required. Be the first to know when we launch.
    </p>
  </main>
</body>
</html>
